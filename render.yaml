services:
  - type: web
    name: launchpad-resume-jobs
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production below makes `npm ci` skip
    # devDependencies, and vite/typescript live there, so the build would fail.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
